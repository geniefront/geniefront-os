<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #f6f5f3; color: #1a1917;
      font: 400 17px/1.45 -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color: #b8143c; } a:hover { color: #b8143c; }
    .lbl { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: #8b857d; }
  </style>
</helmet>

<div style="padding:16px;display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;align-items:baseline;gap:10px">
    <span class="lbl">安静</span>
    <span style="font-size:15px;color:#8b857d">技师端</span>
  </div>

  <div style="background:#ffffff;border:none;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.06);overflow:hidden;padding:20px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;
      background:#a4161a;color:#fff">
      <strong style="font-size:21px">安全提示</strong>
      <div style="font-size:21px;font-weight:700">左手无名指有伤口，避开</div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <span style="display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:#57534e;white-space:nowrap"><span style="width:9px;height:9px;border-radius:50%;background:#b8143c;flex-shrink:0"></span>下一位客人</span><span style="display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:#57534e;white-space:nowrap"><span style="width:9px;height:9px;border-radius:50%;background:#9a5b00;flex-shrink:0"></span><span>★</span>点钟</span><span style="display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:#57534e;white-space:nowrap"><span style="width:9px;height:9px;border-radius:50%;background:#57534e;flex-shrink:0"></span>座位 3 号</span>
    </div>

    <div style="font-size:38px;font-weight:800;line-height:1.15">临时客人</div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
      <span style="font-size:28px;font-weight:700">甲油胶美甲</span>
      <span style="display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:#57534e;white-space:nowrap"><span style="width:9px;height:9px;border-radius:50%;background:#57534e;flex-shrink:0"></span>45 min</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;
      background:#f6f5f3;
      ">
      <div style="display:flex;gap:10px"><span style="min-width:96px;color:#57534e">力度</span><strong style="font-size:21px">重</strong></div>
      <div style="display:flex;gap:10px"><span style="min-width:96px;color:#57534e">甲型</span><strong style="font-size:21px">方圆形</strong></div>
    </div>

    <button style="width:100%;min-height:88px;border-radius:16px;
      border:1px solid #b8143c;
      background:#b8143c;color:#fff;
      font-size:28px;font-weight:600;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      box-shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.06);"><span>▶</span> 开始</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
