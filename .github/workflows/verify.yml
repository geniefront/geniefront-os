name: verify

on:
  push: { branches: [main] }
  pull_request:

# 同一分支只跑最新一次，省额度
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare HeroUI Pro
        run: node scripts/prepare-heroui.mjs
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}

      - name: 宪法检查（service_role / 裸 SET / 排他约束 / 浮点金额）
        run: pnpm lint:guards

      - name: 类型检查
        run: pnpm typecheck
